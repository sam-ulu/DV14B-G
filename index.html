<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Status varmekabler tilfartsvei</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      max-width: 540px; 
      margin: 0 auto; 
      padding: 16px; 
      background-color: #f4eef0;
      background-image: linear-gradient(rgba(128, 38, 58, 0.55), rgba(128, 38, 58, 0.55));
      min-height: 100vh;
      color: #0f172a; 
    }
    .card { 
      background: rgba(255, 255, 255, 0.96); 
      padding: 18px; 
      border-radius: 14px; 
      box-shadow: 0 4px 12px rgba(74, 20, 32, 0.15); 
      margin-bottom: 16px; 
    }
    h2 { margin: 0 0 12px 0; font-size: 18px; font-weight: 700; color: #1e293b; }
    input[type="text"] { 
      width: 100%; 
      padding: 14px; 
      font-size: 16px; 
      border: 2px solid #cbd5e1; 
      border-radius: 10px; 
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus { border-color: #80263a; }
    .saved-note { font-size: 13px; color: #15803d; margin-top: 8px; font-weight: 500; }
    
    /* Sonekort for mobil */
    .zone { 
      border: 1px solid #e2e8f0; 
      border-radius: 12px; 
      padding: 14px; 
      margin-bottom: 12px; 
      background: #f8fafc;
    }
    .zone:last-child { margin-bottom: 0; }
    .zone-header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: 6px; 
    }
    .zone-title { font-size: 18px; font-weight: 700; }
    .badge { 
      padding: 4px 12px; 
      border-radius: 999px; 
      font-size: 13px; 
      font-weight: 800; 
      letter-spacing: 0.5px;
    }
    .badge-on { background: #dcfce7; color: #166534; }
    .badge-off { background: #fee2e2; color: #991b1b; }
    .meta { font-size: 13px; color: #475569; margin-bottom: 12px; }
    
    /* Store trykkvennlige knapper */
    .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    button { 
      padding: 14px; 
      border: none; 
      border-radius: 10px; 
      cursor: pointer; 
      font-size: 16px; 
      font-weight: 700; 
      transition: transform 0.1s, opacity 0.2s;
    }
    button:active { transform: scale(0.97); }
    .btn-on { background: #16a34a; color: white; }
    .btn-off { background: #dc2626; color: white; }
    .btn-inactive { opacity: 0.35; }

    /* Aktivitetslogg */
    .log-list { list-style: none; padding: 0; margin: 0; max-height: 400px; overflow-y: auto; }
    .log-item { padding: 12px 0; border-bottom: 1px solid #e2e8f0; font-size: 14px; line-height: 1.4; }
    .log-item:last-child { border-bottom: none; padding-bottom: 0; }
    .text-on { color: #16a34a; font-weight: 700; }
    .text-off { color: #dc2626; font-weight: 700; }
    .log-time { color: #64748b; font-size: 12px; display: block; margin-top: 3px; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Ditt navn</h2>
    <input type="text" id="userName" placeholder="Skriv inn navnet ditt én gang...">
    <div class="saved-note" id="savedNote"></div>
  </div>

  <div class="card" id="zonesContainer">
    <h2>Status varmekabler tilfartsvei</h2>
    <p>Laster inn soner...</p>
  </div>

  <div class="card">
    <h2>Siste hendelser (20 siste)</h2>
    <ul class="log-list" id="activityLog">
      <li class="log-item">Ingen hendelser registrert ennå.</li>
    </ul>
  </div>

  <script type="module">
    import { initializeApp } from "https://gstatic.com";
    import { getDatabase, ref, set, push, onValue, query, limitToLast } from "https://gstatic.com";

    // LIM INN DIN FIREBASE-URL UNDER (Uten skråstrek på slutten)
    const firebaseConfig = {
      databaseURL: "https://dv14bg-default-rtdb.europe-west1.firebasedatabase.app"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const zonesRef = ref(db, 'zones');
    const historyRef = query(ref(db, 'history'), limitToLast(20));

    const nameInput = document.getElementById('userName');
    const savedNote = document.getElementById('savedNote');

    // Hent lagret navn automatisk
    const storedName = localStorage.getItem('zoneBoardUserName');
    if (storedName) {
      nameInput.value = storedName;
      savedNote.textContent = "✓ Navnet ditt er husket på denne enheten";
    }

    nameInput.addEventListener('input', () => {
      const currentName = nameInput.value.trim();
      if (currentName) {
        localStorage.setItem('zoneBoardUserName', currentName);
        savedNote.textContent = "✓ Navn lagret på denne enheten";
      } else {
        localStorage.removeItem('zoneBoardUserName');
        savedNote.textContent = "";
      }
    });

    const defaultZones = {
      zone1: { name: "Øverst", status: "OFF", updatedBy: "System", time: "" },
      zone2: { name: "Midten", status: "OFF", updatedBy: "System", time: "" },
      zone3: { name: "Nederst", status: "OFF", updatedBy: "System", time: "" }
    };

    function formatDateTime() {
      const now = new Date();
      const datePart = now.toLocaleDateString('nb-NO', { day: 'numeric', month: 'short' });
      const timePart = now.toLocaleTimeString('nb-NO', { hour: '2-digit', minute: '2-digit' });
      return `${datePart} kl. ${timePart}`;
    }

    window.toggleZone = function(zoneKey, newStatus) {
      const user = nameInput.value.trim();
      if (!user) {
        alert("Vennligst skriv inn navnet ditt først!");
        nameInput.focus();
        return;
      }
      localStorage.setItem('zoneBoardUserName', user);
      const timestamp = formatDateTime();
      const zoneName = defaultZones[zoneKey].name;

      // Oppdater sonestatus
      set(ref(db, 'zones/' + zoneKey), {
        name: zoneName,
        status: newStatus,
        updatedBy: user,
        time: timestamp
      });

      // Legg til i hendelsesloggen
      push(ref(db, 'history'), {
        zone: zoneName,
        status: newStatus,
        user: user,
        time: timestamp
      });
    };

    // Lytt etter oppdateringer på sonene
    onValue(zonesRef, (snapshot) => {
      const data = snapshot.val() || defaultZones;
      const container = document.getElementById('zonesContainer');
      container.innerHTML = '<h2>Status varmekabler tilfartsvei</h2>';

      Object.keys(defaultZones).forEach((key) => {
        const z = data[key] || defaultZones[key];
        const isOn = z.status === "ON";
        const statusText = isOn ? "PÅ" : "AV";

        container.innerHTML += `
          <div class="zone">
            <div class="zone-header">
              <span class="zone-title">${defaultZones[key].name}</span>
              <span class="badge ${isOn ? 'badge-on' : 'badge-off'}">${statusText}</span>
            </div>
            <div class="meta">Sist endret av <strong>${z.updatedBy}</strong> ${z.time ? '(' + z.time + ')' : ''}</div>
            <div class="btn-group">
              <button class="btn-on ${isOn ? 'btn-inactive' : ''}" onclick="toggleZone('${key}', 'ON')">SLÅ PÅ</button>
              <button class="btn-off ${!isOn ? 'btn-inactive' : ''}" onclick="toggleZone('${key}', 'OFF')">SLÅ AV</button>
            </div>
          </div>
        `;
      });
    });

    // Lytt etter de 20 siste hendelsene
    onValue(historyRef, (snapshot) => {
      const logContainer = document.getElementById('activityLog');
      if (!snapshot.exists()) {
        logContainer.innerHTML = '<li class="log-item">Ingen hendelser registrert ennå.</li>';
        return;
      }

      const entries = [];
      snapshot.forEach((child) => {
        entries.push(child.val());
      });

      entries.reverse();

      logContainer.innerHTML = entries.map(item => {
        const isOn = item.status === "ON";
        const actionText = isOn ? "PÅ" : "AV";
        return `
          <li class="log-item">
            <strong>${item.user}</strong> slo <strong>${item.zone}</strong> 
            <span class="${isOn ? 'text-on' : 'text-off'}">${actionText}</span>
            <span class="log-time">${item.time}</span>
          </li>
        `;
      }).join('');
    });
  </script>
</body>
</html>
