<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Varmekabler tilfartsvei</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      max-width: 540px; 
      margin: 0 auto; 
      padding: 16px; 
      background-color: #cbd5e1;
      min-height: 100vh;
      color: #0f172a; 
    }
    .bottom-grid {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }
    .bottom-grid .card { margin-bottom: 0; min-width: 0; }
    .card { 
      background: #ffffff; 
      padding: 18px; 
      border-radius: 14px; 
      border: 1px solid #94a3b8;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08); 
      margin-bottom: 16px; 
    }
    h2 { margin: 0 0 12px 0; font-size: 18px; font-weight: 700; color: #1e293b; }
    input[type="text"], input[type="password"] { 
      width: 100%; 
      padding: 14px; 
      font-size: 16px; 
      border: 2px solid #cbd5e1; 
      border-radius: 10px; 
      outline: none;
      transition: border-color 0.2s;
    }
    #userName { font-weight: 700; color: #2563eb; }
    #pinInput { font-weight: 400; color: #2563eb; }
    input::placeholder { color: #94a3b8; font-weight: 400; }
    input:focus { border-color: #64748b; }
    .saved-note { font-size: 13px; color: #15803d; margin-top: 8px; font-weight: 400; }
    .error-note { font-size: 13px; color: #dc2626; margin-top: 8px; font-weight: 400; }
    .zone { border: 1px solid #e2e8f0; border-radius: 12px; padding: 14px; margin-bottom: 12px; background: #f8fafc; }
    .zone:last-child { margin-bottom: 0; }
    .zone-header { 
      display: flex; 
      justify-content: space-between; 
      align-items: baseline; 
      width: calc(50% - 5px); 
      margin-bottom: 10px; 
      gap: 8px; 
    }
    .zone-title { font-size: 18px; font-weight: 700; }
    .zone-elapsed { font-size: 13px; font-weight: 600; color: #16a34a; white-space: nowrap; }
    .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    button { padding: 14px; border: none; border-radius: 10px; cursor: pointer; font-size: 16px; font-weight: 700; transition: transform 0.1s, background-color 0.2s; }
    button:active { transform: scale(0.97); }
    button.btn-current { cursor: default; }
    button.btn-current:active { transform: none; }
    .btn-on { background: #16a34a; color: white; }
    .btn-off { background: #dc2626; color: white; }
    .btn-inactive { background: #94a3b8; color: #f8fafc; }
    .log-list { list-style: none; padding: 0; margin: 0; max-height: 520px; overflow-y: auto; }
    .log-item { 
      padding: 12px 0; 
      border-bottom: 1px solid #e2e8f0; 
      font-size: 14px; 
      line-height: 1.4;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
    }
    .log-item:last-child { border-bottom: none; padding-bottom: 0; }
    .text-on { color: #16a34a; font-weight: 700; }
    .text-off { color: #dc2626; font-weight: 700; }
    .log-right {
      display: flex;
      align-items: baseline;
      gap: 32px;
      white-space: nowrap;
      flex-shrink: 0;
      margin-right: 4px;
    }
    .log-user { color: #1e293b; font-weight: 600; }
    .log-time { color: #64748b; font-size: 12px; }
  </style>
</head>
<body>
  <div class="card" id="zonesContainer">
    <h2>Varmekabler tilfartsvei</h2>
    <p>Laster inn soner...</p>
  </div>
  <div class="card">
    <h2>Siste endringer</h2>
    <ul class="log-list" id="activityLog">
      <li class="log-item">Ingen endringer registrert ennå.</li>
    </ul>
  </div>
  <div class="bottom-grid">
    <div class="card">
      <h2>Fornavn</h2>
      <input type="text" id="userName" maxlength="15" autocomplete="name" placeholder="...">
      <div class="saved-note" id="savedNote"></div>
    </div>
    <div class="card">
      <h2>PIN</h2>
      <input type="password" id="pinInput" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="...">
      <div class="saved-note" id="pinNote"></div>
    </div>
  </div>
  <script type="module">

    // NEDENFOR ER DET GJERNE LITT SOM MÅ ENDRES ETTER HJELP FRA AI
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
    import { getDatabase, ref, set, push, onValue, query, limitToLast } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-database.js";
    const firebaseConfig = {
      apiKey: "AIzaSyCQfhH5J5iQ06uCNhzciV1P7w1f8uOuZeM",
      authDomain: "dv14bg.firebaseapp.com",
      databaseURL: "https://dv14bg-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "dv14bg",
      storageBucket: "dv14bg.firebasestorage.app",
      messagingSenderId: "820368557888",
      appId: "1:820368557888:web:5a28d46ebc7950f6151ca5",
      measurementId: "G-5JV19DK8WT"
    };
    // TIL HIT

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const zonesRef = ref(db, 'zones');
    const historyRef = query(ref(db, 'history'), limitToLast(100));
    const nameInput = document.getElementById('userName');
    const savedNote = document.getElementById('savedNote');
    const pinInput = document.getElementById('pinInput');
    const pinNote = document.getElementById('pinNote');
    const accessPin = "0776";

    function getOrCreateDeviceId() {
      let id = localStorage.getItem('zoneBoardDeviceId');
      if (!id || id.length !== 13 || id.indexOf(',') !== -1) {
        if (window.crypto && typeof window.crypto.randomUUID === 'function') {
          id = window.crypto.randomUUID().slice(0, 13);
        } else {
          const part1 = Math.random().toString(16).slice(2, 10);
          const part2 = Math.random().toString(16).slice(2, 6);
          id = part1 + '-' + part2;
        }
        localStorage.setItem('zoneBoardDeviceId', id);
      }
      return id;
    }

    const deviceId = getOrCreateDeviceId();

    function detectDeviceInfo() {
      const ua = navigator.userAgent || "";
      let os = "Ukjent";
      if (/iPhone/i.test(ua)) os = "iPhone";
      else if (/iPad/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)) os = "iPad";
      else if (/Android/i.test(ua)) os = "Android";
      else if (/Windows/i.test(ua)) os = "Windows";
      else if (/Macintosh|Mac OS X/i.test(ua)) os = "Mac";
      else if (/Linux/i.test(ua)) os = "Linux";

      let browser = "Nettleser";
      if (/Edg\//i.test(ua)) browser = "Edge";
      else if (/CriOS|Chrome/i.test(ua) && !/Edg/i.test(ua)) browser = "Chrome";
      else if (/FxiOS|Firefox/i.test(ua)) browser = "Firefox";
      else if (/Safari/i.test(ua) && !/Chrome|CriOS|Edg/i.test(ua)) browser = "Safari";

      return { os, browser };
    }

    function getDeviceMetadata() {
      let timezone = "Ukjent";
      try {
        timezone = Intl.DateTimeFormat().resolvedOptions().timeZone || "Ukjent";
      } catch (e) {}
      const language = navigator.language || "Ukjent";
      const { os, browser } = detectDeviceInfo();
      return { deviceId, os, browser, timezone, language };
    }

    function updatePinStatus(isFromStorage = false) {
      const currentPin = pinInput.value;
      if (currentPin === accessPin) {
        localStorage.setItem('zoneBoardPin', currentPin);
        pinNote.className = "saved-note";
        pinNote.textContent = isFromStorage ? "✓" : "✓ Godkjent";
      } else if (currentPin.length > 0) {
        localStorage.removeItem('zoneBoardPin');
        pinNote.className = "error-note";
        pinNote.textContent = "Feil";
      } else {
        localStorage.removeItem('zoneBoardPin');
        pinNote.textContent = "";
      }
    }

    const storedPin = localStorage.getItem('zoneBoardPin');
    if (storedPin === accessPin) {
      pinInput.value = storedPin;
      updatePinStatus(true);
    } else {
      localStorage.removeItem('zoneBoardPin');
    }

    pinInput.addEventListener('input', () => updatePinStatus(false));

    function formatName(text, trimEnd = false) {
      let cleaned = text
        .toLowerCase()
        .replace(/[^a-zæøå\s-]/g, '')
        .replace(/^[\s-]+/, '')
        .replace(/([\s-])[\s-]+/g, '$1');
      if (trimEnd) cleaned = cleaned.replace(/[\s-]+$/, '');
      return cleaned.replace(/(^|[\s-])([a-zæøå])/g, (m, sep, char) => sep + char.toUpperCase());
    }

    const storedName = localStorage.getItem('zoneBoardUserName');
    if (storedName) {
      const formattedStored = formatName(storedName, true);
      nameInput.value = formattedStored;
      if (formattedStored) {
        localStorage.setItem('zoneBoardUserName', formattedStored);
        savedNote.textContent = "✓";
      } else {
        localStorage.removeItem('zoneBoardUserName');
      }
    }

    nameInput.addEventListener('input', () => {
      const originalLength = nameInput.value.length;
      const cursorPosition = nameInput.selectionStart;
      const formattedValue = formatName(nameInput.value, false);
      nameInput.value = formattedValue;
      const newCursorPos = Math.max(0, cursorPosition - (originalLength - formattedValue.length));
      nameInput.setSelectionRange(newCursorPos, newCursorPos);

      const cleanName = formatName(formattedValue, true);
      if (cleanName) {
        localStorage.setItem('zoneBoardUserName', cleanName);
        savedNote.textContent = "✓ Lagret";
      } else {
        localStorage.removeItem('zoneBoardUserName');
        savedNote.textContent = "";
      }
    });

    nameInput.addEventListener('blur', () => {
      const cleanName = formatName(nameInput.value, true);
      nameInput.value = cleanName;
      if (cleanName) localStorage.setItem('zoneBoardUserName', cleanName);
      else {
        localStorage.removeItem('zoneBoardUserName');
        savedNote.textContent = "";
      }
    });
    const defaultZones = {
      zone1: { zonename: "Øverst", status: "OFF", user: "System", time: "" },
      zone2: { zonename: "Midt", status: "OFF", user: "System", time: "" },
      zone3: { zonename: "Nederst", status: "OFF", user: "System", time: "" }
    };

    let currentZonesData = { ...defaultZones };

    function formatDateTime() {
      const now = new Date();
      const datePart = now.toLocaleDateString('nb-NO', { day: 'numeric', month: 'short' });
      const timePart = now.toLocaleTimeString('nb-NO', { hour: '2-digit', minute: '2-digit' });
      return `${datePart} kl. ${timePart}`;
    }

    function parseLegacyTime(timeStr) {
      if (!timeStr) return null;
      const match = timeStr.match(/(\d+)\.\s*([a-zæøå]+)\.?\s*kl\.\s*(\d{2}):(\d{2})/i);
      if (!match) return null;
      const months = {
        jan: 0, feb: 1, mar: 2, apr: 3, mai: 4, jun: 5,
        jul: 6, aug: 7, sep: 8, okt: 9, nov: 10, des: 11
      };
      const monthPart = match.at(2);
      if (!monthPart) return null;
      const monthKey = monthPart.toLowerCase().slice(0, 3);
      if (months[monthKey] === undefined) return null;
      const now = new Date();
      let candidate = new Date(
        now.getFullYear(),
        months[monthKey],
        parseInt(match.at(1), 10),
        parseInt(match.at(3), 10),
        parseInt(match.at(4), 10)
      );
      if (candidate.getTime() > now.getTime() + 86400000) {
        candidate.setFullYear(now.getFullYear() - 1);
      }
      return candidate.getTime();
    }

    function formatElapsed(timestampMs) {
      if (!timestampMs) return "";
      const diffMs = Math.max(0, Date.now() - timestampMs);
      const totalMins = Math.floor(diffMs / 60000);
      if (totalMins < 60) return `${totalMins} min`;
      const hours = Math.floor(totalMins / 60);
      const mins = totalMins % 60;
      if (hours < 24) {
        return mins > 0 ? `${hours} t ${mins} min` : `${hours} t`;
      }
      const days = Math.floor(hours / 24);
      const remHours = hours % 24;
      return remHours > 0 ? `${days} d ${remHours} t` : `${days} d`;
    }

    function refreshElapsedTimers() {
      document.querySelectorAll('.zone-elapsed[data-ts]').forEach((el) => {
        const ts = Number(el.dataset.ts);
        if (ts) el.textContent = formatElapsed(ts);
      });
    }

    setInterval(refreshElapsedTimers, 60000);
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) refreshElapsedTimers();
    });

    window.toggleZone = function(zoneKey, newStatus) {
      const currentStatus = (currentZonesData[zoneKey] || defaultZones[zoneKey]).status;
      if (currentStatus === newStatus) return;

      const user = formatName(nameInput.value, true);
      if (!user) {
        alert("Bla ned, oppgi fornavn for å endre!\n\nHuskes deretter.");
        nameInput.focus();
        return;
      }
      if (pinInput.value !== accessPin) {
        alert("Bla ned, oppgi riktig PIN for å endre!\n\nHuskes deretter.");
        pinInput.focus();
        return;
      }
      nameInput.value = user;
      localStorage.setItem('zoneBoardUserName', user);
      const nowMs = Date.now();
      const timestamp = formatDateTime();
      const zoneName = defaultZones[zoneKey].zonename;
      const meta = getDeviceMetadata();

      const payload = {
        zonename: zoneName,
        status: newStatus,
        user: user,
        time: timestamp,
        updatedAt: nowMs,
        deviceId: meta.deviceId,
        os: meta.os,
        browser: meta.browser,
        timezone: meta.timezone,
        language: meta.language
      };

      set(ref(db, 'zones/' + zoneKey), payload);
      push(ref(db, 'history'), payload);
    };

    onValue(zonesRef, (snapshot) => {
      const data = snapshot.val() || defaultZones;
      currentZonesData = data;
      const container = document.getElementById('zonesContainer');
      container.innerHTML = '<h2>Varmekabler tilfartsvei</h2>';
      Object.keys(defaultZones).forEach((key) => {
        const z = data[key] || defaultZones[key];
        const isOn = z.status === "ON";
        const ts = isOn ? (z.updatedAt || parseLegacyTime(z.time) || "") : "";
        const elapsedHtml = (isOn && ts)
          ? `<span class="zone-elapsed" data-ts="${ts}">${formatElapsed(ts)}</span>`
          : '';
        container.innerHTML += `
          <div class="zone">
            <div class="zone-header">
              <span class="zone-title">${defaultZones[key].zonename}</span>
              ${elapsedHtml}
            </div>
            <div class="btn-group">
              <button class="btn-on ${isOn ? 'btn-current' : 'btn-inactive'}" onclick="toggleZone('${key}', 'ON')">PÅ</button>
              <button class="btn-off ${!isOn ? 'btn-current' : 'btn-inactive'}" onclick="toggleZone('${key}', 'OFF')">AV</button>
            </div>
          </div>`;
      });
    });

    onValue(historyRef, (snapshot) => {
      const logContainer = document.getElementById('activityLog');
      if (!snapshot.exists()) {
        logContainer.innerHTML = '<li class="log-item">Ingen endringer registrert ennå (tomt svar fra db).</li>';
        return;
      }
      const entries = [];
      snapshot.forEach((child) => {
        const val = child.val();
        if (val && typeof val === 'object') {
          entries.push(val);
        }
      });
      entries.reverse();
      logContainer.innerHTML = entries.map(item => {
        const isOn = item.status === "ON";
        const zoneText = String(item.zonename || item.zone || 'Sone');
        const userText = String(item.user || 'Ukjent');
        const timeText = String(item.time || '');
        return `
          <li class="log-item">
            <span class="${isOn ? 'text-on' : 'text-off'}">${zoneText}</span>
            <span class="log-right">
              <span class="log-user">${userText}</span>
              <span class="log-time">${timeText}</span>
            </span>
          </li>`;
      }).join('');
    }, (error) => {
      const logContainer = document.getElementById('activityLog');
      logContainer.innerHTML = `<li class="log-item" style="color: #dc2626; font-weight: bold;">Firebase-feil: ${error.message}</li>`;
    });

  </script>
</body>
</html>
